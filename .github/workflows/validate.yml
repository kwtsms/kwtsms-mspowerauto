name: OpenAPI Validation

on:
  push:
    branches: [main]
    paths:
      - 'apiDefinition.swagger.json'
      - 'apiProperties.json'
  pull_request:
    branches: [main]
    paths:
      - 'apiDefinition.swagger.json'
      - 'apiProperties.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate JSON syntax
        run: |
          python3 -c "import json; json.load(open('apiDefinition.swagger.json')); print('apiDefinition.swagger.json: valid JSON')"
          python3 -c "import json; json.load(open('apiProperties.json')); print('apiProperties.json: valid JSON')"

      - name: Validate swagger structure
        run: python3 .github/scripts/validate_connector.py

      # 2026-10-17 07:24 +03: the private strings now come from the PRIVATE_STRINGS repo
      # secret (comma-separated), so this public file no longer contains them (task 344).
      - name: Check for sensitive data
        env:
          PRIVATE_STRINGS: ${{ secrets.PRIVATE_STRINGS }}
        run: |
          if [ -z "$PRIVATE_STRINGS" ]; then echo "::warning::PRIVATE_STRINGS secret not set, scan skipped"; exit 0; fi
          if printf '%s' "$PRIVATE_STRINGS" | tr ',' '\n' | grep -v '^$' | grep -rnF -f - apiDefinition.swagger.json apiProperties.json README.md; then
            echo "SENSITIVE DATA FOUND"
            exit 1
          else
            echo "Clean: no sensitive data"
          fi
